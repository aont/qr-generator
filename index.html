<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Code Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #18202a; background: #f4f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem 1rem; }
    main { width: min(100%, 42rem); margin: 0 auto; padding: clamp(1.25rem, 4vw, 2rem); background: #fff; border: 1px solid #dce1e6; border-radius: .75rem; box-shadow: 0 .25rem 1rem rgb(24 32 42 / 8%); }
    h1 { margin: 0 0 .4rem; font-size: clamp(1.6rem, 5vw, 2.1rem); }
    .intro { margin: 0 0 1.5rem; color: #52606d; }
    fieldset { margin: 0 0 1.25rem; padding: 0; border: 0; }
    legend, label { font-weight: 650; }
    .mode-options { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: .65rem; }
    .mode-options label, .checkbox { display: flex; align-items: center; gap: .45rem; font-weight: 500; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; margin-bottom: .4rem; }
    input[type="text"], input[type="password"], select, textarea { width: 100%; padding: .7rem .75rem; border: 1px solid #aab4be; border-radius: .35rem; background: #fff; color: inherit; font: inherit; }
    textarea { min-height: 7rem; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 3px solid #b9d5ff; border-color: #1769c2; }
    .checkbox { margin-bottom: 1rem; }
    button { padding: .72rem 1.1rem; border: 0; border-radius: .35rem; background: #1769c2; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #10559f; }
    [hidden] { display: none !important; }
    #error { margin: 1rem 0 0; padding: .75rem; border: 1px solid #c63232; border-radius: .35rem; color: #8b1717; background: #fff5f5; }
    #result { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #dce1e6; text-align: center; }
    #result h2 { margin: 0 0 1rem; font-size: 1.15rem; }
    #qrcode { display: inline-block; max-width: 100%; padding: .75rem; background: #fff; border: 1px solid #dce1e6; }
    #qrcode img, #qrcode canvas { display: block; max-width: 100%; height: auto; }
    @media (max-width: 30rem) { body { padding: 0; } main { min-height: 100vh; border: 0; border-radius: 0; box-shadow: none; } }
  </style>
</head>
<body>
  <main>
    <h1>QR Code Generator</h1>
    <p class="intro">Create a QR code for text or a Wi-Fi network.</p>

    <form id="generator-form">
      <fieldset>
        <legend>Content type</legend>
        <div class="mode-options">
          <label><input type="radio" name="mode" value="text" checked> Plain text</label>
          <label><input type="radio" name="mode" value="wifi"> Wi-Fi access point</label>
        </div>
      </fieldset>

      <div id="text-fields">
        <div class="field">
          <label for="text">Text or URL</label>
          <textarea id="text" required placeholder="Enter text or a URL"></textarea>
        </div>
      </div>

      <div id="wifi-fields" hidden>
        <div class="field">
          <label for="ssid">Network name (SSID)</label>
          <input id="ssid" type="text" autocomplete="off">
        </div>
        <div class="field">
          <label for="authentication">Authentication type</label>
          <select id="authentication">
            <option value="WPA">WPA</option>
            <option value="WEP">WEP</option>
            <option value="nopass">No password</option>
          </select>
        </div>
        <div class="field" id="password-field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="new-password">
        </div>
        <label class="checkbox"><input id="hidden-ssid" type="checkbox"> Hidden network</label>
      </div>

      <button type="submit">Generate QR code</button>
    </form>

    <p id="error" role="alert" hidden></p>
    <section id="result" aria-live="polite" hidden>
      <h2>Your QR code</h2>
      <div id="qrcode" aria-label="Generated QR code"></div>
    </section>
  </main>

  <script>
    const form = document.querySelector('#generator-form');
    const textInput = document.querySelector('#text');
    const textFields = document.querySelector('#text-fields');
    const wifiFields = document.querySelector('#wifi-fields');
    const ssidInput = document.querySelector('#ssid');
    const authentication = document.querySelector('#authentication');
    const passwordInput = document.querySelector('#password');
    const passwordField = document.querySelector('#password-field');
    const hiddenInput = document.querySelector('#hidden-ssid');
    const error = document.querySelector('#error');
    const result = document.querySelector('#result');
    const qrContainer = document.querySelector('#qrcode');

    function setMode(mode) {
      document.querySelector(`input[name="mode"][value="${mode}"]`).checked = true;
      const isWifi = mode === 'wifi';
      textFields.hidden = isWifi;
      wifiFields.hidden = !isWifi;
      textInput.required = !isWifi;
      ssidInput.required = isWifi;
      updatePasswordField();
    }

    function updatePasswordField() {
      const needsPassword = authentication.value !== 'nopass';
      passwordField.hidden = !needsPassword;
      passwordInput.required = !wifiFields.hidden && needsPassword;
    }

    function escapeWifi(value) {
      return value.replace(/[\\;,:\"]/g, '\\$&');
    }

    function wifiPayload() {
      const password = authentication.value === 'nopass' ? '' : `P:${escapeWifi(passwordInput.value)};`;
      return `WIFI:T:${authentication.value};S:${escapeWifi(ssidInput.value)};${password}H:${hiddenInput.checked};;`;
    }

    function showError(message) {
      error.textContent = message;
      error.hidden = false;
      result.hidden = true;
    }

    function generate(payload) {
      error.hidden = true;
      qrContainer.replaceChildren();
      try {
        if (typeof QRCode === 'undefined') throw new Error('The QR code library could not be loaded. Check your connection and try again.');
        if (!payload) throw new Error('Enter some content to generate a QR code.');
        new QRCode(qrContainer, { text: payload, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
        result.hidden = false;
        return true;
      } catch (problem) {
        showError(problem instanceof Error ? problem.message : 'QR code generation failed.');
        return false;
      }
    }

    function payloadFromLocation() {
      const encoded = location.hash.startsWith('#?')
        ? location.hash.slice(2)
        : location.search.startsWith('?') ? location.search.slice(1) : null;
      if (encoded === null) return null;
      try { return decodeURIComponent(encoded); }
      catch { showError('The URL contains an invalid encoded payload.'); return null; }
    }

    function restoreFromLocation() {
      const payload = payloadFromLocation();
      if (payload === null) {
        setMode('text');
        textInput.value = '';
        error.hidden = true;
        result.hidden = true;
        qrContainer.replaceChildren();
        return;
      }
      setMode('text');
      textInput.value = payload;
      generate(payload);
    }

    document.querySelectorAll('input[name="mode"]').forEach(input => {
      input.addEventListener('change', () => setMode(input.value));
    });
    authentication.addEventListener('change', updatePasswordField);
    form.addEventListener('submit', event => {
      event.preventDefault();
      const mode = new FormData(form).get('mode');
      const payload = mode === 'wifi' ? wifiPayload() : textInput.value;
      if (generate(payload)) history.pushState(null, '', `#?${encodeURIComponent(payload)}`);
    });
    window.addEventListener('popstate', restoreFromLocation);
    restoreFromLocation();
  </script>
</body>
</html>
